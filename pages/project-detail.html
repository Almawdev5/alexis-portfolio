<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project — Alex'sDev</title>
  <script>(function(){ var t=localStorage.getItem('theme')||'dark'; document.documentElement.setAttribute('data-theme',t); })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    .pd-wrap { min-height:100vh; padding-top:var(--nav); background:var(--bg) }
    .pd-hero  { position:relative; padding:50px 0 80px; overflow:hidden }
    .pd-hero-bg { position:absolute;inset:0;background-image:linear-gradient(rgba(0,245,160,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,160,.04) 1px,transparent 1px);background-size:50px 50px;pointer-events:none }
    .pd-hero-glow { position:absolute;width:600px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(0,245,160,.07) 0%,transparent 70%);top:-100px;right:-100px;pointer-events:none;animation:float 9s ease-in-out infinite }
    .pd-hero-content { position:relative;z-index:1 }
    .pd-breadcrumb { display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:.68rem;color:var(--text3);margin-bottom:32px }
    .pd-breadcrumb a { color:var(--text2);transition:var(--tr) }
    .pd-breadcrumb a:hover { color:var(--accent) }
    .pd-grid { display:grid;grid-template-columns:1fr 380px;gap:48px;align-items:start }

    /* Gallery */
    .pd-gallery {}
    .pd-main-img {
      border-radius:var(--r3);overflow:hidden;border:1px solid var(--border);
      background:var(--bg3);aspect-ratio:16/10;cursor:zoom-in;
      position:relative;transition:var(--tr);
    }
    .pd-main-img:hover { border-color:var(--accent-b);box-shadow:0 0 40px rgba(0,245,160,.1) }
    .pd-main-img img { width:100%;height:100%;object-fit:cover;display:block;transition:var(--tr) }
    .pd-main-img:hover img { transform:scale(1.02) }
    .pd-zoom-hint { position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:5px 11px;font-family:var(--fm);font-size:.6rem;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:6px;pointer-events:none }
    .pd-feat-badge { position:absolute;top:14px;left:14px;font-family:var(--fm);font-size:.62rem;font-weight:700;background:var(--accent);color:var(--bg);padding:4px 10px;border-radius:100px;letter-spacing:.08em }

    /* Thumbnails */
    .pd-thumbs { display:flex;gap:10px;margin-top:12px;flex-wrap:wrap }
    .pd-thumb {
      width:72px;height:54px;border-radius:var(--r);overflow:hidden;
      border:2px solid var(--border);cursor:pointer;transition:var(--tr);flex-shrink:0;
    }
    .pd-thumb:hover { border-color:var(--accent-b) }
    .pd-thumb.active { border-color:var(--accent);box-shadow:0 0 12px var(--accent-b) }
    .pd-thumb img { width:100%;height:100%;object-fit:cover;display:block }
    .pd-img-counter { font-family:var(--fm);font-size:.65rem;color:var(--text3);margin-top:8px }

    /* Info card */
    .pd-info-card { background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:28px;position:relative;overflow:hidden;margin-bottom:16px }
    .pd-info-card::before { content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad) }
    .pd-badge { display:inline-flex;align-items:center;gap:8px;font-family:var(--fm);font-size:.65rem;color:var(--accent);background:var(--accent-d);border:1px solid var(--accent-b);padding:5px 12px;border-radius:100px;letter-spacing:.1em;margin-bottom:14px }
    .pd-badge-dot { width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pulse 2s ease-in-out infinite }
    .pd-title { font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:12px }
    .pd-desc { font-size:.88rem;color:var(--text2);line-height:1.85;margin-bottom:20px }
    .pd-divider { height:1px;background:var(--border);margin:20px 0 }
    .pd-tech { display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px }
    .pd-tech span { font-family:var(--fm);font-size:.65rem;background:var(--bg2);border:1px solid var(--border2);color:var(--text2);padding:4px 10px;border-radius:100px }
    .pd-actions { display:flex;flex-direction:column;gap:10px }
    .pd-btn { display:flex;align-items:center;justify-content:center;gap:9px;padding:12px;border-radius:var(--r);font-family:var(--fm);font-size:.75rem;font-weight:700;letter-spacing:.05em;cursor:pointer;transition:var(--tr);border:none;text-decoration:none }
    .pd-btn-primary { background:var(--accent);color:var(--bg) }
    .pd-btn-primary:hover { box-shadow:0 0 20px var(--accent-b);transform:translateY(-2px) }
    .pd-btn-secondary { background:var(--bg2);color:var(--text2);border:1px solid var(--border) !important }
    .pd-btn-secondary:hover { border-color:var(--accent) !important;color:var(--accent);transform:translateY(-2px) }
    .pd-btn-gh { background:var(--bg2);color:var(--text2);border:1px solid var(--border) !important }
    .pd-btn-gh:hover { border-color:rgba(255,255,255,.3) !important;color:#fff;transform:translateY(-2px) }

    /* Long description section */
    .pd-long-desc { background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:28px;margin-top:24px }
    .pd-long-desc-title { font-family:var(--fm);font-size:.68rem;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px }
    .pd-long-desc-title::before { content:'';width:20px;height:1px;background:var(--accent) }
    .pd-long-desc-text { font-size:.88rem;color:var(--text2);line-height:1.9 }

    /* Lightbox */
    .pd-lightbox { position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(16px);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out }
    .pd-lightbox.open { display:flex }
    .pd-lightbox img { max-width:90vw;max-height:90vh;border-radius:var(--r2);box-shadow:0 24px 80px rgba(0,0,0,.8);border:1px solid rgba(0,245,160,.2) }
    .pd-lightbox-close { position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:var(--r);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--tr) }
    .pd-lightbox-close:hover { background:rgba(255,80,80,.3) }
    .pd-lightbox-prev, .pd-lightbox-next { position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:var(--r);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:.9rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--tr) }
    .pd-lightbox-prev { left:20px }
    .pd-lightbox-next { right:70px }
    .pd-lightbox-prev:hover, .pd-lightbox-next:hover { background:rgba(0,245,160,.2);border-color:var(--accent-b) }

    .pd-not-found { text-align:center;padding:120px 24px }
    .pd-not-found i { font-size:4rem;color:var(--text3);display:block;margin-bottom:20px }

    @media(max-width:900px){ .pd-grid{grid-template-columns:1fr;gap:28px} }
  </style>
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="../index.html" class="nav-logo">Alex'sDev<span>.</span></a>
      <div class="nav-links">
        <a class="nav-link" href="../index.html">Home</a>
        <a class="nav-link" href="../index.html#about">About</a>
        <a class="nav-link" href="../index.html#skills">Skills</a>
        <a class="nav-link active" href="../index.html#projects">Projects</a>
        <a class="nav-link" href="../index.html#services">Services</a>
        <a class="nav-link" href="../index.html#certificates">Certificates</a>
        <a class="nav-cta" href="../index.html#contact">Hire Me</a>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-moon theme-toggle-icon theme-toggle-moon"></i>
        <i class="fas fa-sun theme-toggle-icon theme-toggle-sun"></i>
      </button>
      <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
    </div>
  </nav>
  <div class="nav-mobile" id="navMobile">
    <a class="nav-link" href="../index.html">Home</a>
    <a class="nav-link active" href="../index.html#projects">Projects</a>
    <a class="nav-link" href="../index.html#contact">Contact</a>
  </div>

  <div class="pd-wrap">
    <div id="pdContent"></div>
  </div>

  <!-- Lightbox -->
  <div class="pd-lightbox" id="pdLightbox">
    <button class="pd-lightbox-close" id="lbClose"><i class="fas fa-times"></i></button>
    <button class="pd-lightbox-prev" id="lbPrev"><i class="fas fa-chevron-left"></i></button>
    <img id="lbImg" src="" alt="">
    <button class="pd-lightbox-next" id="lbNext"><i class="fas fa-chevron-right"></i></button>
  </div>

  <footer style="background:var(--bg2);border-top:1px solid var(--border);padding:24px 0">
    <div class="container" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div class="footer-logo">Alex'sDev<span>.</span></div>
      <div style="font-family:var(--fm);font-size:.68rem;color:var(--text3)">© 2025 Almaw Tadele</div>
      <a href="../index.html#projects" style="font-family:var(--fm);font-size:.68rem;color:var(--text2)">← Back to Projects</a>
    </div>
  </footer>

  <button class="back-top" id="backTop"><i class="fas fa-arrow-up"></i></button>

  <script src="../js/data.js"></script>
  <script>
    // Theme
    document.getElementById('themeToggle')?.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    // Navbar
    const navbar  = document.getElementById('navbar');
    const backTop = document.getElementById('backTop');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 20);
      backTop.classList.toggle('visible', window.scrollY > 400);
    });
    backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    document.getElementById('navToggle').addEventListener('click', function() {
      this.classList.toggle('open');
      document.getElementById('navMobile').classList.toggle('open');
    });

    // Load data
    const saved = localStorage.getItem('alexPortfolioData');
    const data  = saved ? JSON.parse(saved) : portfolioData;
    const idx   = parseInt(new URLSearchParams(window.location.search).get('id'));
    const proj  = data.projects[idx];
    const el    = document.getElementById('pdContent');

    if (!proj || isNaN(idx)) {
      el.innerHTML = `
        <div class="pd-not-found">
          <i class="fas fa-rocket"></i>
          <h2>Project Not Found</h2>
          <p style="color:var(--text2);margin-bottom:24px">This project doesn't exist or may have been removed.</p>
          <a href="../index.html#projects" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Back to Projects</a>
        </div>`;
    } else {
      const isDemo   = proj.live === '#' && proj.github === '#';
      const images   = proj.images && proj.images.length ? proj.images : [proj.image];
      let activeImg  = 0;

      document.title = `${proj.name} — Alex'sDev`;

      // Deduplication of images
      const deviconMap = {
        'Python':'devicon-python-plain colored','JavaScript':'devicon-javascript-plain colored',
        'TypeScript':'devicon-typescript-plain colored','React':'devicon-react-original colored',
        'Next.js':'devicon-nextjs-plain','Node.js':'devicon-nodejs-plain colored',
        'Django':'devicon-django-plain colored','FastAPI':'devicon-fastapi-plain colored',
        'HTML':'devicon-html5-plain colored','CSS':'devicon-css3-plain colored',
        'MySQL':'devicon-mysql-plain colored','Supabase':'devicon-supabase-plain colored',
        'TensorFlow':'devicon-tensorflow-original colored','PyTorch':'devicon-pytorch-original colored',
        'GitHub':'devicon-github-original','Git':'devicon-git-plain colored',
      };

      const techHTML = proj.tech.map(t => {
        const icon = deviconMap[t] ? `<i class="${deviconMap[t]}" style="font-size:.9rem;vertical-align:middle;margin-right:4px;"></i>` : '';
        return `<span>${icon}${t}</span>`;
      }).join('');

      const thumbsHTML = images.length > 1 ? `
        <div class="pd-thumbs" id="pdThumbs">
          ${images.map((img, i) => `
            <div class="pd-thumb ${i===0?'active':''}" data-idx="${i}">
              <img src="../${img}" alt="Screenshot ${i+1}"
                onerror="this.parentElement.style.display='none'">
            </div>`).join('')}
        </div>
        <div class="pd-img-counter" id="pdCounter">1 / ${images.length}</div>` : '';

      el.innerHTML = `
        <section class="pd-hero">
          <div class="pd-hero-bg"></div>
          <div class="pd-hero-glow"></div>
          <div class="pd-hero-content">
            <div class="container">
              <div class="pd-breadcrumb">
                <a href="../index.html">Home</a>
                <i class="fas fa-chevron-right" style="font-size:.5rem"></i>
                <a href="../index.html#projects">Projects</a>
                <i class="fas fa-chevron-right" style="font-size:.5rem"></i>
                <span style="color:var(--accent)">${proj.name}</span>
              </div>
              <div class="pd-grid">

                <!-- Gallery -->
                <div class="reveal-left">
                  <div class="pd-main-img" id="pdMainImg">
                    <img id="pdActiveImg" src="../${images[0]}" alt="${proj.name}"
                      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                    <div style="display:none;align-items:center;justify-content:center;height:300px;color:var(--text3)">
                      <i class="fas fa-code" style="font-size:3rem;opacity:.2"></i>
                    </div>
                    <div class="pd-zoom-hint"><i class="fas fa-search-plus"></i> Click to zoom</div>
                    ${proj.featured ? '<div class="pd-feat-badge">⭐ Featured</div>' : ''}
                  </div>
                  ${thumbsHTML}

                  ${proj.longDescription ? `
                  <div class="pd-long-desc">
                    <div class="pd-long-desc-title">About This Project</div>
                    <div class="pd-long-desc-text">${proj.longDescription}</div>
                  </div>` : ''}
                </div>

                <!-- Info -->
                <div class="reveal-right">
                  <div class="pd-info-card">
                    <div class="pd-badge"><span class="pd-badge-dot"></span>${proj.featured ? 'Featured Project' : 'Project'}</div>
                    <div class="pd-title">${proj.name}</div>
                    <div class="pd-desc">${proj.description}</div>
                    <div class="pd-divider"></div>
                    <div style="font-family:var(--fm);font-size:.6rem;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px">Tech Stack</div>
                    <div class="pd-tech">${techHTML}</div>
                    <div class="pd-divider"></div>
                    <div class="pd-actions">
                      ${!isDemo ? `<a href="${proj.live}" target="_blank" class="pd-btn pd-btn-primary"><i class="fas fa-external-link-alt"></i> Live Demo</a>` : `<div class="pd-btn pd-btn-primary" style="opacity:.5;cursor:default"><i class="fas fa-clock"></i> Coming Soon</div>`}
                      ${!isDemo ? `<a href="${proj.github}" target="_blank" class="pd-btn pd-btn-gh"><i class="fab fa-github"></i> View on GitHub</a>` : ''}
                      <a href="../index.html#projects" class="pd-btn pd-btn-secondary"><i class="fas fa-arrow-left"></i> Back to Projects</a>
                    </div>
                  </div>

                  <!-- Prev / Next -->
                  <div style="display:flex;gap:10px">
                    ${idx > 0 ? `<a href="project-detail.html?id=${idx-1}" class="btn btn-outline" style="flex:1;justify-content:center;font-size:.72rem"><i class="fas fa-chevron-left"></i> Previous</a>` : ''}
                    ${idx < data.projects.length-1 ? `<a href="project-detail.html?id=${idx+1}" class="btn btn-outline" style="flex:1;justify-content:center;font-size:.72rem">Next <i class="fas fa-chevron-right"></i></a>` : ''}
                  </div>
                </div>

              </div>
            </div>
          </div>
        </section>`;

      // ── Gallery logic ──
      const mainImg     = document.getElementById('pdActiveImg');
      const mainWrap    = document.getElementById('pdMainImg');
      const counter     = document.getElementById('pdCounter');
      const thumbsWrap  = document.getElementById('pdThumbs');

      function setActive(i) {
        activeImg = i;
        mainImg.src = `../${images[i]}`;
        if (counter) counter.textContent = `${i+1} / ${images.length}`;
        document.querySelectorAll('.pd-thumb').forEach((t,ti) => t.classList.toggle('active', ti===i));
      }

      thumbsWrap?.querySelectorAll('.pd-thumb').forEach(thumb => {
        thumb.addEventListener('click', () => setActive(parseInt(thumb.dataset.idx)));
      });

      // ── Lightbox ──
      const lightbox = document.getElementById('pdLightbox');
      const lbImg    = document.getElementById('lbImg');
      const open  = (i) => { activeImg=i; lbImg.src=`../${images[i]}`; lightbox.classList.add('open'); document.body.style.overflow='hidden'; };
      const close = () => { lightbox.classList.remove('open'); document.body.style.overflow=''; };

      mainWrap?.addEventListener('click', () => open(activeImg));
      document.getElementById('lbClose').addEventListener('click', close);
      lightbox.addEventListener('click', e => { if(e.target===lightbox) close(); });
      document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); open((activeImg-1+images.length)%images.length); });
      document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); open((activeImg+1)%images.length); });
      document.addEventListener('keydown', e => {
        if (!lightbox.classList.contains('open')) return;
        if (e.key==='Escape') close();
        if (e.key==='ArrowLeft')  open((activeImg-1+images.length)%images.length);
        if (e.key==='ArrowRight') open((activeImg+1)%images.length);
      });

      // ── Scroll reveal ──
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('visible'); obs.unobserve(e.target); } });
      }, {threshold:.1});
      document.querySelectorAll('.reveal-left,.reveal-right').forEach(el => obs.observe(el));
    }
  </script>
</body>
</html>
